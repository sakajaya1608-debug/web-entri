<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - SAKA BERJAYA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <h1>SAKA BERJAYA</h1>
    <p class="subtitle">Web Entri Data Statistik</p>

    <form id="loginForm">
      <label>Email Admin</label>
      <input type="email" id="email" value="sakajaya1608@gmail.com" required autocomplete="email">

      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" id="btnLogin">Masuk</button>
      <p id="error" class="error"></p>
    </form>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { showToast } from "./js/ui-helper.js";

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("btnLogin");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Memuat...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast("Login berhasil!", "success");
        setTimeout(() => window.location.href = "dashboard.html", 500);
      } catch (err) {
        let msg = "Login gagal";
        if (err.code === "auth/user-not-found") msg = "Email tidak terdaftar";
        else if (err.code === "auth/wrong-password") msg = "Password salah";
        else if (err.code === "auth/invalid-email") msg = "Format email salah";
        else if (err.code === "auth/too-many-requests") msg = "Terlalu banyak percobaan. Coba lagi nanti";
        else msg = err.message;

        errorEl.textContent = msg;
        showToast(msg, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>
