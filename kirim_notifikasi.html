<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kirim Notifikasi V1 - SAKA BERJAYA</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Menggunakan library jose yang berjalan di browser -->
  <script type="module">
    import { SignJWT, importPKCS8 } from 'https://cdn.jsdelivr.net/npm/jose@5.2.0/+esm';
    window.SignJWT = SignJWT;
    window.importPKCS8 = importPKCS8;
  </script>
</head>
<body>
  <header>
    <h1>Kirim Notifikasi Push (V1 API)</h1>
    <div class="user-info">
      <a href="dashboard.html">← Dashboard</a>
      <span id="userEmail">-</span>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="status-info status-warning" style="margin-bottom: 16px;">
      ⚠️ Notifikasi akan dikirim ke <b>SEMUA</b> pengguna aplikasi SAKA BERJAYA.
    </div>

    <div class="form-group" style="flex-direction: column; align-items: stretch;">
      
      <!-- Input File Service Account -->
      <div style="margin-bottom: 12px;">
        <label style="font-weight: bold;">Upload Service Account JSON</label>
        <input type="file" id="serviceAccountFile" accept=".json" 
               style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px;">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-weight: bold;">Judul Notifikasi</label>
        <input type="text" id="notifTitle" placeholder="Contoh: Publikasi Baru Telah Terbit!" 
               style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px;">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="font-weight: bold;">Pesan Notifikasi</label>
        <textarea id="notifBody" rows="3" placeholder="Contoh: Segera cek publikasi terbaru di menu Publikasi."
                  style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px;"></textarea>
      </div>
      
      <button id="btnKirim" style="background: #4CAF50; padding: 12px; font-size: 15px;">🚀 Kirim Notifikasi</button>
    </div>
  </main>

  <script type="module">
    import "./js/auth-guard.js";

    document.getElementById("btnKirim").onclick = async () => {
      const fileInput = document.getElementById("serviceAccountFile");
      const title = document.getElementById("notifTitle").value.trim();
      const body = document.getElementById("notifBody").value.trim();

      if (!fileInput.files.length) {
        alert("Harap upload file Service Account JSON terlebih dahulu!");
        return;
      }
      if (!title || !body) {
        alert("Isi Judul dan Pesan!");
        return;
      }

      const btn = document.getElementById("btnKirim");
      btn.disabled = true;
      btn.textContent = "⏳ Mengirim...";

      try {
        // 1. Baca file JSON
        const file = fileInput.files[0];
        const text = await file.text();
        const serviceAccount = JSON.parse(text);
        const projectId = serviceAccount.project_id;

        // 2. Buat JWT menggunakan library jose
        const privateKey = await window.importPKCS8(serviceAccount.private_key, 'RS256');
        const now = Math.floor(Date.now() / 1000);
        
        const jwt = await new window.SignJWT({
          iss: serviceAccount.client_email,
          scope: 'https://www.googleapis.com/auth/firebase.messaging',
          aud: 'https://oauth2.googleapis.com/token',
          iat: now,
          exp: now + 3600 // Token berlaku 1 jam
        })
        .setProtectedHeader({ alg: 'RS256' })
        .sign(privateKey);

        // 3. Tukar JWT dengan Access Token
        const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
            assertion: jwt
          })
        });

        const tokenData = await tokenResponse.json();
        if (!tokenData.access_token) {
          throw new Error("Gagal mendapatkan Access Token: " + JSON.stringify(tokenData));
        }
        const accessToken = tokenData.access_token;

        // 4. Kirim Notifikasi via FCM V1 Endpoint
        const response = await fetch(`https://fcm.googleapis.com/v1/projects/${projectId}/messages:send`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + accessToken
          },
          body: JSON.stringify({
            message: {
              topic: "all_users",
              notification: {
                title: title,
                body: body
              }
            }
          })
        });

        if (response.ok) {
          alert("✅ Notifikasi berhasil dikirim!");
          document.getElementById("notifTitle").value = "";
          document.getElementById("notifBody").value = "";
        } else {
          const err = await response.json();
          console.error(err);
          alert("❌ Gagal mengirim: " + (err.error?.message || "Unknown error"));
        }
      } catch (e) {
        console.error(e);
        alert("❌ Error: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Kirim Notifikasi";
      }
    };
  </script>
</body>
</html>
